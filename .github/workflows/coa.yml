# Free COA generator (/coa/, /claim/): SHA-256 known vectors, payload round-trip
# against the shared contract, QR fitting, and the /claim/ malformed-payload path.
# Also fails if the built pages drift from scripts/coa/build.py. No key, no network.
name: coa generator

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  coa:
    name: COA generator self-test (hash · payload · QR · /claim/)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/coa/test-coa.mjs
      - name: Pages match scripts/coa/build.py
        run: python3 scripts/coa/build.py && git diff --exit-code -- coa claim
